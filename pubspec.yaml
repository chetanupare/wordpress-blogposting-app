name: sp_posting
description: SP News Maregaon WordPress Manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3+1
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Cache
  hive_flutter: ^1.1.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^0.8.9

  # UI Utilities
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  connectivity_plus: ^6.0.3
  intl: ^0.20.2
  url_launcher: ^6.3.0

  # Google Fonts
  google_fonts: ^6.2.1
  flutter_quill: ^9.5.15
  vsc_quill_delta_to_html: ^1.0.5
  quill_html_converter: ^9.5.15
  local_auth: ^2.3.0
  image_cropper: ^12.2.1
  webview_flutter: ^4.13.1
  flutter_quill_delta_from_html: ^1.3.12
  lottie: ^3.3.1
  flutter_image_compress: ^2.5.0
  image: ^4.8.0
  mime: ^2.0.0
  flutter_animate: ^4.5.2
  animations: ^2.1.1
  flutter_staggered_animations: ^1.1.1
  loading_animation_widget: ^1.3.0
  flutter_speed_dial: ^7.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
